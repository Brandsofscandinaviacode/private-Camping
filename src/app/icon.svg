<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- CampSense mark: the sidebar logo — gradient rounded square + tent glyph.
       Colours are the sRGB equivalents of --sidebar-primary (oklch(0.63 0.19 38))
       and its lighter gradient end, since SVG favicons can't rely on oklch. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f56333"/>
      <stop offset="100%" stop-color="#e4531f"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <!-- lucide "tent" paths, scaled from a 24px box and centred -->
  <g transform="translate(4 4) scale(1)"
     fill="none" stroke="#ffffff" stroke-width="2.2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 21 14 3"/>
    <path d="M20.5 21 10 3"/>
    <path d="M15.5 21 12 15l-3.5 6"/>
    <path d="M2 21h20"/>
  </g>
</svg>
