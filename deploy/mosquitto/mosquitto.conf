# CampSense Mosquitto broker — plain TCP on port 1883
#
# The app connects via Docker's internal network (hostname "mosquitto"),
# so TLS is not needed between app and broker.
#
# Place this file at /opt/mosquitto/config/mosquitto.conf on the host.

allow_anonymous false
password_file /mosquitto/config/passwd

listener 1883

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type warning
log_type error
log_type notice
