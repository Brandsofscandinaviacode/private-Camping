# CampSense Mosquitto broker — TLS listener on 8883
#
# Lives on the host at /opt/mosquitto/config/mosquitto.conf and is mounted
# read-only into the container at /mosquitto/config/mosquitto.conf.

# ── Authentication ──
# No anonymous clients. Users live in the password file created with
# mosquitto_passwd. (Global setting — applies to every listener because
# per_listener_settings is left at its default of false.)
allow_anonymous false
password_file /mosquitto/config/passwd

# ── TLS listener ──
listener 8883
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
tls_version tlsv1.2

# ── Persistence ──
persistence true
persistence_location /mosquitto/data/

# ── Logging (to container stdout → visible in Coolify logs) ──
log_dest stdout
log_type warning
log_type error
log_type notice
