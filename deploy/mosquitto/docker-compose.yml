# Mosquitto MQTT broker — Coolify Docker Compose
#
# Runs the broker as a second Coolify resource, alongside the CampSense app.
# TLS terminates here on port 8883 using a Let's Encrypt cert obtained by the
# host's certbot and copied into /opt/mosquitto/certs by a renewal hook.
#
# Host prep (run once — see DEPLOYMENT.md "Part 3: Mosquitto inside Coolify"):
#   /opt/mosquitto/config/mosquitto.conf   ← the conf in this folder
#   /opt/mosquitto/config/passwd           ← created with mosquitto_passwd
#   /opt/mosquitto/certs/fullchain.pem     ← copied from Let's Encrypt
#   /opt/mosquitto/certs/privkey.pem       ← copied from Let's Encrypt (chown 1883)

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "8883:8883"
    volumes:
      - /opt/mosquitto/config:/mosquitto/config:ro
      - /opt/mosquitto/certs:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data

volumes:
  mosquitto-data:
