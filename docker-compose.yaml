services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: "file:/app/data/campsense.db"
      SESSION_SECRET: "${SESSION_SECRET}"
      FORCE_HTTPS: "true"
    volumes:
      - campsense-data:/app/data
    ports:
      - "3000:3000"
    depends_on:
      - mosquitto
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    environment:
      MQTT_USERNAME: "${MQTT_USERNAME:-campsense}"
      MQTT_PASSWORD: "${MQTT_PASSWORD}"
    volumes:
      - mosquitto-data:/mosquitto/data
    # Self-configuring: writes its config + password file from the env vars
    # above on every start, then launches the broker. No host files needed,
    # so it works the same on any host (Coolify, plain Docker, etc.).
    command:
      - sh
      - -c
      - |
        set -e
        if [ -z "$$MQTT_PASSWORD" ]; then
          echo "ERROR: MQTT_PASSWORD env var is not set" >&2
          exit 1
        fi
        printf 'allow_anonymous false\npassword_file /mosquitto/config/passwd\nlistener 1883\npersistence true\npersistence_location /mosquitto/data/\nlog_dest stdout\nlog_type warning\nlog_type error\nlog_type notice\n' > /mosquitto/config/mosquitto.conf
        mosquitto_passwd -b -c /mosquitto/config/passwd "$$MQTT_USERNAME" "$$MQTT_PASSWORD"
        chown mosquitto:mosquitto /mosquitto/config/mosquitto.conf /mosquitto/config/passwd 2>/dev/null || true
        exec mosquitto -c /mosquitto/config/mosquitto.conf

volumes:
  campsense-data:
  mosquitto-data:
